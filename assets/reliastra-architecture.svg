<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" role="img" aria-labelledby="relArchTitle relArchDesc">
  <title id="relArchTitle">RELIASTRA — Security Boundaries, Deterministic Detection, and Cryptographic Evidence Pipeline</title>
  <desc id="relArchDesc">Architecture diagram of the RELIASTRA platform showing SSRF-safe IP-pinned probing, server-side tenant isolation, out-of-process Celery scheduling, deterministic state confirmation, 5-signal weighted attribution, and Ed25519/SHA-256 verifiable evidence records.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="540" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Bar -->
  <text x="32" y="34" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">
    SYSTEM ARCHITECTURE · RELIASTRA (ReliaAstra/Reliastra) — EXTERNAL DEPENDENCY INTELLIGENCE &amp; EVIDENCE PIPELINE
  </text>
  <text x="1168" y="34" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    DEPLOYED TOPOLOGY: 1 ORIGIN (us-east) · Δ = 300s
  </text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- ZONE 1: Tenant & Credential Boundary -->
  <g transform="translate(32, 64)">
    <rect x="0" y="0" width="266" height="390" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="266" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      1. TENANT &amp; CREDENTIAL BOUNDARY
    </text>

    <!-- Sub-box 1A -->
    <rect x="14" y="44" width="238" height="96" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="64" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Server-Side Tenant Isolation
    </text>
    <text x="24" y="82" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • 1 Account = 1 Tenant (DB-scoped)
    </text>
    <text x="24" y="98" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Zero routes accept client tenant_id
    </text>
    <text x="24" y="114" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Separate Admin token audience
    </text>
    <text x="24" y="130" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      platform/tenancy/middleware.py
    </text>

    <!-- Sub-box 1B -->
    <rect x="14" y="152" width="238" height="114" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="172" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Cryptographic Credential Hygiene
    </text>
    <text x="24" y="190" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Probe headers: Fernet AES-128-CBC
    </text>
    <text x="24" y="205" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
        + HMAC-SHA256 (write-only API)
    </text>
    <text x="24" y="221" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • API keys (rel_*): prefix + SHA-256
    </text>
    <text x="24" y="237" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Refresh token family theft revocation
    </text>
    <text x="24" y="254" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      platform/security/field_encryption.py
    </text>

    <!-- Sub-box 1C -->
    <rect x="14" y="278" width="238" height="98" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="298" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Agent &amp; CLI Access Surfaces
    </text>
    <text x="24" y="316" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • MCP Server: 18 tools (HTTP client
    </text>
    <text x="24" y="331" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
        only, no DB, 427 unit tests)
    </text>
    <text x="24" y="347" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Go CLI: stdlib-only, 0600 config
    </text>
    <text x="24" y="364" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      backend/mcp_server/ · cli/cmd/
    </text>
  </g>

  <!-- Arrow Zone 1 -> Zone 2 -->
  <line x1="298" y1="255" x2="322" y2="255" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <!-- ZONE 2: Egress & SSRF-Safe Probing -->
  <g transform="translate(326, 64)">
    <rect x="0" y="0" width="276" height="390" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="276" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      2. SSRF-SAFE PINNED EGRESS
    </text>

    <!-- Sub-box 2A -->
    <rect x="14" y="44" width="248" height="114" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="64" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Out-of-Process Celery Dispatch
    </text>
    <text x="24" y="82" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Celery Beat → Redis → Worker
    </text>
    <text x="24" y="98" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Probes never run in API process
    </text>
    <text x="24" y="114" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Time-limited worker heartbeats
    </text>
    <text x="24" y="130" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Missed checks never backfilled
    </text>
    <text x="24" y="146" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      modules/checks/dispatch.py
    </text>

    <!-- Sub-box 2B -->
    <rect x="14" y="170" width="248" height="206" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="24" y="190" fill="#FBBF24" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      DNS-Rebinding-Safe IP Pinning
    </text>
    <text x="24" y="208" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      1. Resolve DNS once; verify all IPs
    </text>
    <text x="24" y="224" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      2. Unwrap IPv4-in-IPv6 bypasses:
    </text>
    <text x="24" y="239" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
         ::ffff:a.b.c.d &amp; NAT64 64:ff9b::/96
    </text>
    <text x="24" y="255" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      3. Reject RFC1918, 127/8, CGNAT,
    </text>
    <text x="24" y="270" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
         169.254.0.0/16 metadata, fc00::/7
    </text>
    <text x="24" y="286" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      4. Pin TCP to validated IP via httpcore
    </text>
    <text x="24" y="301" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
         while keeping TLS sni_hostname
    </text>
    <text x="24" y="317" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      5. Re-validate ≤5 redirects; blocked =
    </text>
    <text x="24" y="332" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
         config error, never vendor outage
    </text>
    <text x="24" y="362" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      platform/security/ssrf.py (TOCTOU closed)
    </text>
  </g>

  <!-- Arrow Zone 2 -> Zone 3 -->
  <line x1="602" y1="255" x2="626" y2="255" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <!-- ZONE 3: Deterministic Detection & Attribution -->
  <g transform="translate(630, 64)">
    <rect x="0" y="0" width="268" height="390" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="268" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      3. CONFIRMATION &amp; ATTRIBUTION
    </text>

    <!-- Sub-box 3A -->
    <rect x="14" y="44" width="240" height="148" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="64" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Pure-Function Fault Confirmation
    </text>
    <text x="24" y="82" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Replayable; no clock/random reads
    </text>
    <text x="24" y="98" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Single-origin persistence rule:
    </text>
    <text x="24" y="114" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
        open:    consecutive_failures ≥ 2
    </text>
    <text x="24" y="130" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
        resolve: consecutive_successes ≥ 2
    </text>
    <text x="24" y="146" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • 9 explicit states (target vs dispatch)
    </text>
    <text x="24" y="178" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      modules/checks/detection.py
    </text>

    <!-- Sub-box 3B -->
    <rect x="14" y="204" width="240" height="172" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="224" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      5-Signal Attribution Engine (v1.1)
    </text>
    <text x="24" y="242" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      temporal (0.20) + endpoint (0.25) +
    </text>
    <text x="24" y="256" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      latency (0.25) + error_pattern (0.15) +
    </text>
    <text x="24" y="270" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      infra_baseline (0.15) = 1.00
    </text>
    <text x="24" y="290" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • Single-watcher max score: 55.0
    </text>
    <text x="24" y="305" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        (vendor_failure ≥ 75 needs 2nd source)
    </text>
    <text x="24" y="321" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • DNS/TLS/timeout degrades baseline
    </text>
    <text x="24" y="362" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      modules/attribution/service.py
    </text>
  </g>

  <!-- Arrow Zone 3 -> Zone 4 -->
  <line x1="898" y1="255" x2="922" y2="255" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ZONE 4: Cryptographic Evidence & Public Verification -->
  <g transform="translate(926, 64)">
    <rect x="0" y="0" width="242" height="390" rx="8" fill="#0B1324" stroke="#065F46" stroke-width="1.2"/>
    <rect x="0" y="0" width="242" height="30" rx="8" fill="#064E3B"/>
    <text x="14" y="20" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      4. VERIFIABLE EVIDENCE
    </text>

    <!-- Sub-box 4A -->
    <rect x="14" y="44" width="214" height="162" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="64" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Dual-Hash &amp; Ed25519 Signing
    </text>
    <text x="24" y="84" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • data_hash:
    </text>
    <text x="24" y="98" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        SHA-256(canonical JSON facts)
    </text>
    <text x="24" y="116" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • report_checksum:
    </text>
    <text x="24" y="130" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        SHA-256(rendered PDF bytes)
    </text>
    <text x="24" y="148" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      • Ed25519 Signature + Keyring:
    </text>
    <text x="24" y="162" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        key_id + key_fingerprint
    </text>
    <text x="24" y="192" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      modules/evidence/signing.py
    </text>

    <!-- Sub-box 4B -->
    <rect x="14" y="218" width="214" height="158" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="238" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12.5" font-weight="700">
      Zero-Trust Public Verification
    </text>
    <text x="24" y="256" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • Unauthenticated:
    </text>
    <text x="24" y="270" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        GET /v1/verify/{id}
    </text>
    <text x="24" y="284" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        GET /v1/verify/keys (OKP JWK)
    </text>
    <text x="24" y="302" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • Confirms integrity without
    </text>
    <text x="24" y="316" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        exposing private config
    </text>
    <text x="24" y="334" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      • CI Gate: reliastra verify
    </text>
    <text x="24" y="348" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        exit 4 on mismatch/offline
    </text>
    <text x="24" y="366" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      cli/cmd/reliastra/evidence.go
    </text>
  </g>

  <!-- Bottom Epistemic & Security Refusal Ledger -->
  <g transform="translate(32, 470)">
    <rect x="0" y="0" width="1136" height="50" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="20" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      ENFORCED ARCHITECTURAL REFUSALS:
    </text>
    <text x="255" y="20" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      (1) Single vantage point never claimed as regional quorum   ·   (2) Availability never printed without observation count N
    </text>
    <text x="16" y="38" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      (3) Unmeasured windows render sentinel, never 100%   ·   (4) SSRF-blocked probes recorded as config error, never vendor fault   ·   (5) Unsigned records report signed:false
    </text>
  </g>
</svg>
