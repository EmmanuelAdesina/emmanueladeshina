<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" role="img" aria-labelledby="mathTitle mathDesc">
  <title id="mathTitle">Mathematics of Secure Systems — AWS IAM Evaluation Algebra, Graph Reachability, and Telemetry Bounds</title>
  <desc id="mathDesc">Mathematical specification of the 7-stage AWS IAM policy evaluation procedure, the principal-type ceiling survival branch, structural vs. executable reachability in G=(V,E), and the bucketed telemetry estimator bound.</desc>
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="mArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="mArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="mArrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="10" fill="url(#mBg)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="32" y="34" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">
    MATHEMATICS OF SECURE SYSTEMS · FORMAL MODELS &amp; REPRODUCIBLE PROOFS (models/ · tests/test_models.py)
  </text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- LEFT PANEL: 7-Stage IAM Evaluation Algebra & Principal Branch -->
  <g transform="translate(32, 62)">
    <rect x="0" y="0" width="548" height="450" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="548" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      MODEL I · 7-STAGE AWS IAM ALGEBRA &amp; PRINCIPAL-FORM BRANCH
    </text>

    <!-- Stages Pipeline -->
    <g transform="translate(16, 42)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="330" height="38" rx="5" fill="#1F121B" stroke="#F87171" stroke-width="1"/>
      <text x="10" y="16" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
        STAGE 1 · Explicit Deny [SHORT-CIRCUIT]
      </text>
      <text x="10" y="31" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        ∃ s ∈ P_all : Effect(s) = Deny  ⟹  DENY (Terminal)
      </text>

      <!-- Stage 2 & 3 -->
      <rect x="0" y="46" width="330" height="46" rx="5" fill="#171625" stroke="#FBBF24" stroke-width="1"/>
      <text x="10" y="62" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
        STAGES 2 &amp; 3 · Organizations RCP &amp; SCP [CEILINGS]
      </text>
      <text x="10" y="77" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        C_org(q) = Allow_RCP(q) ∧ Allow_SCP(q)  (Commutative: 2 ∘ 3 = 3 ∘ 2)
      </text>
      <text x="10" y="88" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        An Allow in RCP/SCP never grants; absence of Allow produces final DENY
      </text>

      <!-- Stage 4 -->
      <rect x="0" y="100" width="330" height="58" rx="5" fill="#0D2329" stroke="#34D399" stroke-width="1.2"/>
      <text x="10" y="116" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
        STAGE 4 · Resource-Based Policy [GRANT + BRANCH φ(π)]
      </text>
      <text x="10" y="131" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        If G_R(q) = 1 &amp; φ(π) = 1  ⟹  ALLOW at Stage 4 (Bypasses 6 &amp; 7)
      </text>
      <text x="10" y="146" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        If G_R(q) = 1 &amp; φ(π) = 0  ⟹  Grant carried into Ceilings 6 &amp; 7
      </text>

      <!-- Branch callout on right of Stage 4 -->
      <rect x="344" y="96" width="172" height="172" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="354" y="114" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">
        PRINCIPAL PREDICATE φ(π)
      </text>
      <text x="354" y="132" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        φ(π) = 1 (Uncapped by 6,7):
      </text>
      <text x="354" y="146" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • IAM User ARN (M-03)
      </text>
      <text x="354" y="160" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • Role Session ARN (M-04)
      </text>
      <text x="354" y="174" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • PrincipalArn + '*' (M-17)
      </text>
      <text x="354" y="188" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • Federated User ARN (M-19)
      </text>
      <text x="354" y="208" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        φ(π) = 0 (Capped by 6,7):
      </text>
      <text x="354" y="222" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • IAM Role ARN (M-05, M-06)
      </text>
      <text x="354" y="236" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        • Federating User (M-20)
      </text>
      <text x="354" y="256" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
        Selected by CloudTrail principal
      </text>

      <!-- Stage 5 -->
      <rect x="0" y="166" width="330" height="42" rx="5" fill="#0D2329" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="182" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
        STAGE 5 · Identity-Based Policy [GRANT]
      </text>
      <text x="10" y="198" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        Grant G(q) = G_I(q) ∨ G_R(q). If G(q) = 0 ⟹ Implicit DENY
      </text>

      <!-- Stages 6 & 7 -->
      <rect x="0" y="216" width="330" height="52" rx="5" fill="#171625" stroke="#FBBF24" stroke-width="1"/>
      <text x="10" y="232" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
        STAGES 6 &amp; 7 · Permissions Boundary &amp; Session Policy [CEILINGS]
      </text>
      <text x="10" y="247" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        C_prin(q) = Allow_Boundary(q) ∧ Allow_Session(q)
      </text>
      <text x="10" y="260" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        Caps identity grants (M-08, M-09) and Role-ARN resource grants (M-05)
      </text>

      <!-- Theorems / Corollaries Box -->
      <rect x="0" y="280" width="516" height="116" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="298" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">
        Derived Architectural Corollaries (Verified Across Rows M-01..M-26)
      </text>
      <text x="12" y="316" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        • Same-Account Tightening Fallacy: P_eff = C ∩ (G_I ∪ G_R) ⊇ C ∩ G_I.
      </text>
      <text x="12" y="330" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
          A restrictive bucket policy R ⊂ I never narrows a permissive role policy I.
      </text>
      <text x="12" y="348" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        • Cross-Account Conjunction: Eval_A×B(q) = Eval_A(q) ∧ Eval_B(q) (M-21..M-24).
      </text>
      <text x="12" y="366" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        • Union Exceptions: sts:AssumeRole* (M-25) &amp; kms:* (M-26) require G_R(q) = 1.
      </text>
      <text x="12" y="384" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
        • Absent Context Keys: Bool(missing)=false vs BoolIfExists(missing)=true.
      </text>
    </g>
  </g>

  <!-- RIGHT TOP PANEL: Authorization Graph Reachability -->
  <g transform="translate(600, 62)">
    <rect x="0" y="0" width="568" height="214" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="568" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      MODEL II · STRUCTURAL vs. EXECUTABLE GRAPH REACHABILITY IN G = (V, E)
    </text>

    <!-- Nodes -->
    <rect x="20" y="54" width="120" height="44" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="80" y="73" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">user/dev</text>
    <text x="80" y="88" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">Starting Principal</text>

    <line x1="140" y1="76" x2="196" y2="76" stroke="#34D399" stroke-width="1.5" marker-end="url(#mArrowGreen)"/>
    <text x="168" y="68" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">AssumeRole</text>

    <rect x="200" y="54" width="150" height="44" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="275" y="73" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">role/pipeline/ci</text>
    <text x="275" y="88" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">Boundary: Silent</text>

    <!-- Upper Edge (Blocked) -->
    <line x1="350" y1="64" x2="416" y2="54" stroke="#F87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mArrowRed)"/>
    <text x="383" y="48" text-anchor="middle" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Role ARN (M-05)</text>

    <rect x="420" y="38" width="132" height="36" rx="5" fill="#1F121B" stroke="#F87171" stroke-width="1"/>
    <text x="486" y="54" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">s3:::vault-role</text>
    <text x="486" y="67" text-anchor="middle" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">BLOCKED (Stage 6)</text>

    <!-- Lower Edge (Executable) -->
    <line x1="350" y1="88" x2="416" y2="98" stroke="#34D399" stroke-width="1.5" marker-end="url(#mArrowGreen)"/>
    <text x="383" y="112" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Session ARN (M-04)</text>

    <rect x="420" y="82" width="132" height="36" rx="5" fill="#0D2329" stroke="#34D399" stroke-width="1"/>
    <text x="486" y="98" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">s3:::vault-sess</text>
    <text x="486" y="111" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">EXECUTABLE (Stg 4)</text>

    <!-- Explanation Box -->
    <rect x="16" y="128" width="536" height="72" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="26" y="146" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
      ExecBFS(G, s, t, P)  ⊂  StructuralBFS(G, s, t)     |     Time: O(|V| + |E| · C_eval)
    </text>
    <text x="26" y="164" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      Both vaults are structurally 2 hops from user/dev. Only s3:::vault-sess is executable
    </text>
    <text x="26" y="180" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      because naming the AssumedRole session ARN satisfies φ(π)=1 and bypasses Stage 6.
    </text>
  </g>

  <!-- RIGHT BOTTOM PANEL: Telemetry Estimator Bound & Availability Denominators -->
  <g transform="translate(600, 290)">
    <rect x="0" y="0" width="568" height="222" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect x="0" y="0" width="568" height="30" rx="8" fill="#10233F"/>
    <text x="14" y="20" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      MODEL III · TELEMETRY RESOLUTION BOUND &amp; DENOMINATOR UNCERTAINTY
    </text>

    <!-- Sub-box III-A -->
    <rect x="16" y="42" width="536" height="80" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="26" y="60" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">
      Theorem 1 · Resolution Saturation of Occupied-Bucket Estimators
    </text>
    <text x="26" y="78" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      Δ_naive(B) = round(B / c̄_occ) = min(Δ, B)   when true interval Δ ≥ B
    </text>
    <text x="26" y="95" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      For Δ = 300s: at B = 60s, every occupied bucket has c(b)=1 ⟹ Δ_naive(60) = 60s (5× error).
    </text>
    <text x="26" y="111" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      Fix: Median inter-bucket delta Δ_med = median_i(t_{i+1} − t_i) = 300.0s (resolution-invariant).
    </text>

    <!-- Sub-box III-B -->
    <rect x="16" y="130" width="536" height="78" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="26" y="148" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">
      Theorem 2 · Availability Denominator Depth &amp; Exact Binomial Upper Bound
    </text>
    <text x="26" y="166" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      ρ(W) = N(W) / ⌊W / Δ⌋   |   p_max(α=0.05, k=0) = 1 − 0.05^(1/N)
    </text>
    <text x="26" y="183" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      90d label with N = 595 (ρ = 2.3%, 49.6h depth): p_max = 0.502% vs N = 25,920: p_max = 0.0115%
    </text>
    <text x="26" y="199" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      Both print "100.0% availability", hiding a 43.5× difference in statistical evidence.
    </text>
  </g>
</svg>
